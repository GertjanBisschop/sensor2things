variables:
  SECRET_DETECTION_ENABLED: "true"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

stages:
  - linting
  - static-analysis
  - test
  - build

default:
  tags:
    - docker
  image: ghcr.io/astral-sh/uv:python3.14-trixie
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

.code-change-patterns: &code-changes
  - src/**/*
  - pyproject.toml
  - uv.lock
  - pytest.ini

linting:
  stage: linting
  rules:
    - changes: *code-changes
  script:
    - uv run ruff check
    - uv run ruff format --check

static-analysis:
  stage: static-analysis
  rules:
    - changes: *code-changes
  script:
    - uv run pyright

test:
  stage: test
  rules:
    - changes: *code-changes
  script:
    - uv run pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

